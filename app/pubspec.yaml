name: surakshaar
description: "SurakshaAR — offline AR vocational safety training and certification for Jharkhand's mining, steel and mica sectors."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # AR: camera passthrough, math, offline marker detection
  camera: ^0.11.0+2
  vector_math: ^2.1.4
  google_mlkit_barcode_scanning: ^0.13.0

  # Storage (offline-first)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Certificates
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0

  # Misc
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/markers/

  # Fonts are wired in Phase 4 (Hindi/Santali). Noto Sans Ol Chiki must be bundled
  # because Android 10 mid-range devices ship no Ol Chiki glyphs and render tofu.
  # fonts:
  #   - family: NotoSansDevanagari
  #     fonts:
  #       - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
  #       - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
  #         weight: 700
  #   - family: NotoSansOlChiki
  #     fonts:
  #       - asset: assets/fonts/NotoSansOlChiki-Regular.ttf
