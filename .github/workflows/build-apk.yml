name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger a build manually from the GitHub UI

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java (the build needs JDK 17; ubuntu-latest ships 21 but we pin
      #         to 17 to match the compileOptions in build.gradle.kts) ────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      #   Pin to 3.44.x (the toolchain used on the dev machine per HANDOFF.md).
      #   flutter-action caches the SDK so subsequent runs are fast.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'   # latest stable ≥ 3.24 that has Dart 3.5+
          channel: stable
          cache: true

      # ── 4. Dependencies ────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      # ── 5. Code generation (l10n) ──────────────────────────────────────────
      #   The app uses flutter_localizations with generate: true, so the ARB
      #   files must be compiled to .dart before the build sees them.
      - name: Generate localisation files
        working-directory: app
        run: flutter gen-l10n

      # ── 6. Build ───────────────────────────────────────────────────────────
      #   --release so the APK is signed with the debug key (per build.gradle)
      #   and can be sideloaded. Split per ABI keeps sizes manageable; the
      #   fat APK (~85 MB unminified) is included as a fallback for phones
      #   where the split ABI doesn't match.
      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # ── 7. Collect artefacts ───────────────────────────────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: surakshaar-apk-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
